services:
  - type: web
    name: folio-docs-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: folio-postgres-demo
          property: connectionString
databases:
  - name: folio-postgres-demo
    plan: free
